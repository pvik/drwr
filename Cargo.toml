[workspace]
members = ["crates/graphml"]
# Plain `cargo test`/`cargo clippy` should cover the library too.
default-members = [".", "crates/graphml"]

[package]
name = "drwr"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
# As eframe's system fonts use it, so it builds nothing new.
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
graphml = { path = "crates/graphml" }
rfd = "0.17.2"
